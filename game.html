<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>煽り屋になる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<style>
  /* 1 列のタイムライン。上に数字の帯、手口は気象の「注意報」の帯の体裁で出す */
  :root {
    --paper: #f3f5f2;
    --card: #ffffff;
    --ink: #1c2326;
    --muted: #5b676b;
    --line: #d5dcd8;
    --accent: #1d5f8a;
    --accent-ink: #ffffff;
    --advisory: #f2c40f;
    --advisory-ink: #322800;
    --alarm: #c2362d;
    --good: #2c7a57;
    --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
    --body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121719; --card: #1b2225; --ink: #e5ebe8; --muted: #98a4a7; --line: #2d373a;
      --accent: #6db0de; --accent-ink: #0d1a22; --advisory: #e0b40b; --advisory-ink: #221b00;
      --alarm: #ee6a5f; --good: #5bbf92; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121719; --card: #1b2225; --ink: #e5ebe8; --muted: #98a4a7; --line: #2d373a;
    --accent: #6db0de; --accent-ink: #0d1a22; --advisory: #e0b40b; --advisory-ink: #221b00;
    --alarm: #ee6a5f; --good: #5bbf92; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.75 var(--body); }
  .num { font-variant-numeric: tabular-nums; }

  #bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
    display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap;
    padding: 10px max(16px, calc((100% - 640px) / 2));
    background: var(--card); border-bottom: 1px solid var(--line);
  }
  .stat { display: flex; flex-direction: column; line-height: 1.2; }
  .stat .k { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
  .stat .v { font: 22px/1.2 var(--display); font-variant-numeric: tabular-nums; }
  .stat .goal { font-size: 12px; color: var(--muted); }
  .stat:first-child { flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: 6px; }
  .stat:first-child .k { flex-basis: 100%; }
  .stat.chap { margin-left: auto; text-align: right; }
  .stat.chap .v { font-size: 15px; }
  #vcount.rise { color: var(--good); }
  #vcount.fall { color: var(--alarm); }
  .pips { display: flex; gap: 4px; padding-block: 6px; }
  .pip { width: 18px; height: 10px; border-radius: 2px; border: 1px solid var(--muted); }
  .pip.on { background: var(--ink); border-color: var(--ink); }

  #app { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  section { display: flex; flex-direction: column; gap: 16px; }
  h1 { font: 34px/1.3 var(--display); margin: 0; text-wrap: balance; }
  h2 { font: 18px/1.4 var(--display); margin: 20px 0 0; }
  p { margin: 0; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--accent); }
  .eyebrow.alarm { color: var(--alarm); }
  .lead { font-size: 17px; }
  .fine { font-size: 13px; color: var(--muted); }
  a { color: var(--accent); }

  .title { padding-top: 32px; }
  .title h1 { font-size: clamp(40px, 11vw, 64px); line-height: 1.1; }
  .rules { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }

  .go {
    align-self: flex-start; padding: 12px 22px; font: 700 16px/1.2 var(--body);
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; cursor: pointer;
  }
  .go:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid var(--advisory); outline-offset: 2px; }

  .intro { color: var(--muted); }
  .topic { border-left: 4px solid var(--ink); padding: 2px 0 2px 14px; display: flex; flex-direction: column; gap: 2px; }
  .topic .kind { font-size: 12px; letter-spacing: .1em; color: var(--muted); }
  .topic p { font-weight: 700; font-size: 18px; }
  .topic .src { font-size: 12px; color: var(--muted); }

  .drafts { gap: 10px; }
  .drafts h2 { margin-top: 8px; }
  .draft {
    display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer;
    padding: 14px 16px; font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  }
  .draft:hover { border-color: var(--accent); }
  .draft .n { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }

  .post { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .post .who { font-size: 13px; color: var(--muted); }
  .post .who b { color: var(--ink); }
  .post.stranger { border-style: dashed; }
  .post.act { background: transparent; border-style: dashed; }
  .post .did { font-size: 13px; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .metrics { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .replies { list-style: none; margin: 0; padding: 8px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .replies li { font-size: 14px; padding-left: 14px; position: relative; animation: pop .35s ease-out both; animation-delay: calc(var(--i) * .45s + .3s); }
  .replies li::before { content: "↳"; position: absolute; left: 0; color: var(--muted); }
  @keyframes pop { from { opacity: .15; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .deltas { display: flex; gap: 12px; flex-wrap: wrap; font-weight: 700; }
  .d { font-size: 15px; }
  .d.up { color: var(--good); }
  .d.down { color: var(--alarm); }

  .advisory { background: var(--card); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .advisory header { background: var(--advisory); color: var(--advisory-ink); padding: 8px 14px; display: flex; flex-direction: column; }
  .advisory .tag { font-size: 11px; font-weight: 700; letter-spacing: .14em; }
  .advisory h3 { margin: 0; font: 19px/1.4 var(--display); }
  .advisory dl { margin: 0; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
  .advisory dt { font-size: 12px; font-weight: 700; color: var(--muted); padding-top: 3px; white-space: nowrap; }
  .advisory dd { margin: 0; min-width: 0; }
  @media (max-width: 420px) {
    .advisory dl { grid-template-columns: 1fr; gap: 2px; }
    .advisory dd + dt { margin-top: 8px; }
  }

  .frozen h1 { color: var(--alarm); }
  .role-list { display: flex; flex-direction: column; gap: 10px; }
  .role {
    display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer;
    padding: 14px 16px; font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--ink); border-radius: 6px;
  }
  .role:hover { border-color: var(--accent); }
  .rname { font: 18px/1.4 var(--display); display: flex; align-items: center; gap: 8px; }
  .rname .done { font: 700 11px/1 var(--body); padding: 4px 6px; border-radius: 3px; background: var(--line); color: var(--muted); }
  .rpitch { font-size: 14px; }
  .rgoal { font-size: 12px; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .go.sub { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .book-h { font: 15px/1.4 var(--display); margin: 8px 0 0; color: var(--muted); }
  .dm { align-self: flex-end; max-width: 85%; background: var(--ink); color: var(--paper); border-radius: 14px 14px 4px 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; animation: pop .35s ease-out both; animation-delay: 1.8s; }
  .dm .from { font-size: 11px; letter-spacing: .08em; opacity: .7; }
  details.book summary { cursor: pointer; font: 18px/1.4 var(--display); padding-block: 4px; }
  .book-body { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
  .afters { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .afters li { display: grid; grid-template-columns: 7.5em 1fr; gap: 8px; }
  .afters .ch { font-size: 13px; font-weight: 700; color: var(--muted); padding-top: 2px; }

  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { padding: 8px 14px; font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; opacity: .55; }
  .opt.right { opacity: 1; border-color: var(--good); color: var(--good); font-weight: 700; }
  .opt.wrong { opacity: 1; border-color: var(--alarm); color: var(--alarm); text-decoration: line-through; }
  .feedback { display: flex; flex-direction: column; gap: 12px; }
  .verdict { font: 22px/1.3 var(--display); }
  .verdict.ok { color: var(--good); }
  .verdict.ng { color: var(--alarm); }

  @media (prefers-reduced-motion: reduce) { .replies li, .dm { animation: none; } }
</style>

<div id="bar" hidden></div>
<main id="app"></main>

<script src="techniques.js"></script>
<script src="game-roles.js"></script>
<script src="game.js"></script>
