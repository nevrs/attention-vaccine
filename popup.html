<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 270px; margin: 12px; }
  label { display: flex; gap: 6px; align-items: center; }
  [hidden] { display: none !important; }
  #site { border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin: 10px 0; }
  #site .h { font-weight: 600; margin-bottom: 6px; word-break: break-all; }
  #site label { margin: 3px 0; }
  #stats { color: #444; line-height: 1.6; margin-bottom: 8px; }
  .err { color: #c22; }
  button { width: 100%; padding: 6px; margin-top: 6px; }
  details { margin-top: 8px; color: #666; font-size: 12px; }
  summary { cursor: pointer; }
  #site details { margin-top: 6px; }
  #pause { margin-top: 12px; color: #666; font-size: 11px; }
</style>
<div id="site" hidden>
  <div class="h" id="host"></div>
  <label><input type="checkbox" id="use"> このサイトで使う</label>
  <details id="how">
    <summary>表示のしかた</summary>
    <label><input type="radio" name="mode" value="page"> ページ全体（記事向け）</label>
    <label><input type="radio" name="mode" value="block"> ブロックごと（タイムライン向け）</label>
  </details>
</div>
<div id="stats">読み込み中…</div>
<button id="open">設定を開く</button>
<details id="fix" hidden>
  <summary>表示がずれるとき</summary>
  <button id="pick"></button>
</details>
<label id="pause"><input type="checkbox" id="paused"> すべてのサイトで一時停止</label>
<script src="techniques.js"></script>
<script src="checks.js"></script>
<script src="sites.js"></script>
<script src="popup.js"></script>
</html>
